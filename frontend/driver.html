<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetFlow NG — Driver Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e4a7a" />
  <!-- iOS Specific Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192x192.png">
  <link rel="apple-touch-icon" href="assets/logo.svg">
</head>
<body class="bg-slate-50 font-sans h-screen flex flex-col">

  <!-- Driver Header -->
    <header class="bg-gradient-to-r from-blue-900 to-blue-600 text-white shadow-md p-4 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg leading-tight">Driver Portal</h1>
      <p class="text-[10px] text-blue-200" id="driver-truck-name">Loading truck...</p>
    </div>
    <div class="flex gap-2">
      <button onclick="openPasswordModal()" class="text-xs bg-slate-700 hover:bg-slate-800 px-3 py-1.5 rounded-lg font-semibold transition-colors">Change Password</button>
      <button onclick="logoutDriver()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg font-semibold transition-colors">Log Out</button>
    </div>
  </header>

    <!-- Driver Content -->
  <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
    
    <!-- Truck Status Card -->
    <div class="bg-white rounded-xl shadow p-5 border-l-4 border-blue-500">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">My Vehicle</h2>
      <p class="text-2xl font-bold text-blue-900" id="driver-plate">---</p>
      <p class="text-sm text-slate-500 mb-3" id="driver-model">---</p>
      
      <div class="flex gap-4 text-sm bg-slate-50 p-3 rounded-lg">
        <div><span class="text-slate-400">Odometer:</span> <span class="font-semibold" id="driver-odo">0 km</span></div>
        <div><span class="text-slate-400">Fuel:</span> <span class="font-semibold" id="driver-fuel">0 L</span></div>
      </div>
    </div>

    <!-- Update Stats Form -->
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Update Truck Stats</h2>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="text-[10px] text-slate-500">Odometer (km)</label>
          <input type="number" id="update-odo" class="w-full border rounded-lg px-2 py-1 text-sm" placeholder="e.g. 50000">
        </div>
        <div class="flex-1">
          <label class="text-[10px] text-slate-500">Fuel (Liters)</label>
          <input type="number" id="update-fuel" class="w-full border rounded-lg px-2 py-1 text-sm" placeholder="e.g. 150">
        </div>
        <div class="flex items-end">
          <button onclick="updateTruckStats()" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold h-[30px]">Save</button>
        </div>
      </div>
    </div>

    <!-- Live Tracking Status -->
    <div class="w-full bg-green-50 border border-green-200 text-green-700 font-bold py-3 rounded-xl shadow-sm flex justify-center items-center gap-2">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
      </span>
      Live Tracking Active
    </div>

    <!-- Maintenance Alerts -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">My Maintenance</h2>
      <div id="driver-maintenance" class="space-y-2 text-sm text-slate-600">
        Loading...
      </div>
    </div>

    <!-- Quick Comms (FIXED LAYOUT) -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Message Office</h2>
      
      <!-- Added flex flex-col to fix chat bubbles -->
      <div id="driver-chat-log" class="h-48 overflow-y-auto space-y-2 text-sm mb-3 bg-slate-50 p-3 rounded-lg flex flex-col"></div>
      
      <div class="flex gap-2 w-full">
        <input id="driver-chat-input" type="text" placeholder="Type message..." class="flex-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        <button onclick="sendDriverMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 whitespace-nowrap">Send</button>
      </div>
    </div>

  </main>

  <!-- CHANGE PASSWORD MODAL -->
<div id="passwordModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 px-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6">
    <h3 class="text-lg font-bold text-blue-900 mb-4">Change Password</h3>
    
    <form id="driverPasswordForm" class="space-y-4">
      <!-- Current Password -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Current Password</label>
        <div class="relative">
          <!-- MATCHED ID TO d-current-password -->
          <input type="password" id="d-current-password" required class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 pr-10">
          <button type="button" onclick="togglePassword('d-current-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">New Password</label>
        <div class="relative">
          <input type="password" id="d-new-password" required class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 pr-10">
          <button type="button" onclick="togglePassword('d-new-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
          </button>
        </div>
      </div>

      <div class="flex gap-2 mt-6">
        <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Update</button>
        <button type="button" onclick="closePasswordModal()" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-semibold hover:bg-slate-300">Cancel</button>
      </div>
    </form>
  </div>
</div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/driver.js"></script>
</body>
</html>
